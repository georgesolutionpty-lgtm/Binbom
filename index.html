<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
<title>BINBOM</title>

<!-- Tailwind (con soporte completo para clases arbitrarias, ya que esto corre en un navegador real) -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- Fuentes -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- React -->
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>
  body { font-family: 'Inter', system-ui, sans-serif; }
  .font-display { font-family: 'Baloo 2', system-ui, sans-serif; }
  @keyframes fadeIn { from { opacity:0; transform: translate(-50%, 8px);} to {opacity:1; transform: translate(-50%,0);} }
  .toast-anim { animation: fadeIn 0.15s ease-out; }
  .card-shadow { box-shadow: 0 2px 10px rgba(91,44,111,0.08); }
  input[type=number]::-webkit-inner-spin-button { opacity: 1; }
</style>
</head>
<body class="bg-[#FFF8F0]">
<div id="root"></div>
<div id="fallback-error" style="display:none; padding:20px; font-family: monospace; font-size:13px; white-space:pre-wrap; color:#B3501C; background:#FFF3E6;"></div>
<script>
  function showFallbackError(msg) {
    var el = document.getElementById('fallback-error');
    if (el) { el.style.display = 'block'; el.textContent = 'Error al cargar BINBOM:\n\n' + msg; }
  }
  window.addEventListener('error', function (e) {
    showFallbackError((e.message || 'Error desconocido') + '\n' + (e.filename ? (e.filename + ':' + e.lineno) : ''));
  });
  window.addEventListener('unhandledrejection', function (e) {
    showFallbackError('Promesa rechazada: ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
  });
</script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useCallback } = React;

// ---------- Firebase ----------
const firebaseConfig = {
  apiKey: "AIzaSyCIHPPKPsWVS2epbpPJKgGcWB_84RIjgzA",
  authDomain: "binbom-app.firebaseapp.com",
  projectId: "binbom-app",
  storageBucket: "binbom-app.firebasestorage.app",
  messagingSenderId: "918124122963",
  appId: "1:918124122963:web:9250035414c430704d47a6"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const stateDocRef = db.collection("binbom").doc("state");

// ---------- constantes ----------
const FLAVOR_SEED = ["Oreo", "Maní", "Maracuyá", "María", "Chocolate", "Pie de limón"];
const PRICE = 1;

const uid = () => Math.random().toString(36).slice(2, 10);
const todayISO = () => new Date().toISOString().slice(0, 10);
const fmtMoney = (n) => `$${(Number(n) || 0).toFixed(2)}`;
const fmtDate = (iso) => {
  const [y, m, d] = iso.split("-");
  return `${d}/${m}/${y.slice(2)}`;
};

const emptyState = () => ({
  flavors: FLAVOR_SEED.map((name) => ({ id: uid(), name, stock: 0 })),
  insumos: [],
  producciones: [],
  ventas: [],
});

// ---------- iconos (SVG simples, sin dependencias externas) ----------
const Icon = ({ paths, size = 18, strokeWidth = 2, className = "" }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor"
    strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" className={className}>
    {paths}
  </svg>
);
const PackageIcon = (p) => <Icon {...p} paths={<>
  <path d="M16.5 9.4 7.5 4.21" /><path d="M21 8v8a2 2 0 0 1-1 1.73l-7 4a2 2 0 0 1-2 0l-7-4A2 2 0 0 1 3 16V8a2 2 0 0 1 1-1.73l7-4a2 2 0 0 1 2 0l7 4A2 2 0 0 1 21 8Z" />
  <path d="m3.3 7 8.7 5 8.7-5" /><path d="M12 22V12" />
</>} />;
const SnowflakeIcon = (p) => <Icon {...p} paths={<>
  <line x1="12" y1="2" x2="12" y2="22" /><line x1="17" y1="4.5" x2="7" y2="19.5" />
  <line x1="17" y1="19.5" x2="7" y2="4.5" /><line x1="2" y1="12" x2="22" y2="12" />
</>} />;
const ShoppingBagIcon = (p) => <Icon {...p} paths={<>
  <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z" /><path d="M3 6h18" /><path d="M16 10a4 4 0 0 1-8 0" />
</>} />;
const ClipboardListIcon = (p) => <Icon {...p} paths={<>
  <rect x="8" y="2" width="8" height="4" rx="1" /><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2" />
  <path d="M12 11h4" /><path d="M12 16h4" /><path d="M8 11h.01" /><path d="M8 16h.01" />
</>} />;
const BarChart3Icon = (p) => <Icon {...p} paths={<>
  <path d="M3 3v18h18" /><path d="M18 17V9" /><path d="M13 17V5" /><path d="M8 17v-3" />
</>} />;
const PlusIcon = (p) => <Icon {...p} paths={<><path d="M5 12h14" /><path d="M12 5v14" /></>} />;
const MinusIcon = (p) => <Icon {...p} paths={<path d="M5 12h14" />} />;
const TrashIcon = (p) => <Icon {...p} paths={<>
  <path d="M3 6h18" /><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
</>} />;
const XIcon = (p) => <Icon {...p} paths={<><path d="M18 6 6 18" /><path d="m6 6 12 12" /></>} />;
const ChevronRightIcon = (p) => <Icon {...p} paths={<path d="m9 18 6-6-6-6" />} />;
const TrendingUpIcon = (p) => <Icon {...p} paths={<>
  <polyline points="22 7 13.5 15.5 8.5 10.5 2 17" /><polyline points="16 7 22 7 22 13" />
</>} />;
const TrendingDownIcon = (p) => <Icon {...p} paths={<>
  <polyline points="22 17 13.5 8.5 8.5 13.5 2 7" /><polyline points="16 17 22 17 22 11" />
</>} />;
const AlertTriangleIcon = (p) => <Icon {...p} paths={<>
  <path d="m21.73 18-8-14a2 2 0 0 0-3.46 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z" /><path d="M12 9v4" /><path d="M12 17h.01" />
</>} />;
const CheckIcon = (p) => <Icon {...p} paths={<path d="M20 6 9 17l-5-5" />} />;
const SaveIcon = (p) => <Icon {...p} paths={<>
  <path d="M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z" />
  <path d="M17 21v-7a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v7" /><path d="M7 3v4a1 1 0 0 0 1 1h7" />
</>} />;
const CopyIcon = (p) => <Icon {...p} paths={<>
  <rect x="9" y="9" width="13" height="13" rx="2" /><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
</>} />;
const UploadIcon = (p) => <Icon {...p} paths={<>
  <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /><polyline points="17 8 12 3 7 8" /><line x1="12" y1="3" x2="12" y2="15" />
</>} />;
const PencilIcon = (p) => <Icon {...p} paths={<>
  <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z" /><path d="m15 5 4 4" />
</>} />;

// ---------- shell visual: "nudo de bolsa" ----------
function BagKnot({ color = "#5B2C6F" }) {
  return (
    <svg width="34" height="16" viewBox="0 0 34 16" className="block">
      <path d="M2 14 C 2 4, 10 2, 17 2 C 24 2, 32 4, 32 14" fill="none" stroke={color} strokeWidth="3" strokeLinecap="round" />
      <circle cx="17" cy="3" r="2.6" fill={color} />
    </svg>
  );
}

function Card({ children, className = "" }) {
  return (
    <div className={`relative rounded-2xl bg-white card-shadow border border-[#EFE3F3] pt-5 px-4 pb-4 ${className}`}>
      <div className="absolute -top-2 left-5"><BagKnot /></div>
      {children}
    </div>
  );
}

function EmptyState({ icon: IconComp, title, sub }) {
  return (
    <div className="flex flex-col items-center justify-center text-center py-14 px-6 text-[#8B7695]">
      <IconComp size={30} strokeWidth={1.6} className="mb-3 opacity-60" />
      <p className="font-medium text-[#5B2C6F]">{title}</p>
      <p className="text-sm mt-1 max-w-[220px]">{sub}</p>
    </div>
  );
}

function Toast({ message }) {
  if (!message) return null;
  return (
    <div className="fixed bottom-24 left-1/2 -translate-x-1/2 bg-[#241B2F] text-white text-sm px-4 py-2.5 rounded-full shadow-lg flex items-center gap-2 z-50 toast-anim">
      <CheckIcon size={14} className="text-[#2EC4B6]" />
      {message}
    </div>
  );
}

function BackupModal({ state, lastSaved, saveError, onClose, onRestore }) {
  const [mode, setMode] = useState("export");
  const [importText, setImportText] = useState("");
  const [importError, setImportError] = useState(false);
  const [copied, setCopied] = useState(false);
  const json = JSON.stringify(state, null, 2);

  const copyToClipboard = async () => {
    try {
      await navigator.clipboard.writeText(json);
      setCopied(true);
      setTimeout(() => setCopied(false), 1500);
    } catch (e) { setCopied(false); }
  };

  const handleImport = () => {
    const ok = onRestore(importText);
    setImportError(!ok);
  };

  return (
    <div className="fixed inset-0 bg-black/40 z-50 flex items-end justify-center">
      <div className="bg-white w-full max-w-md rounded-t-3xl px-5 pt-5 pb-8 overflow-y-auto" style={{ maxHeight: "85vh" }}>
        <div className="flex items-center justify-between mb-1">
          <h3 className="font-display font-bold text-lg text-[#5B2C6F]">Respaldo de datos</h3>
          <button onClick={onClose} className="w-8 h-8 rounded-full bg-[#F4E9F7] flex items-center justify-center">
            <XIcon size={16} className="text-[#8B7695]" />
          </button>
        </div>
        <p className="text-xs text-[#8B7695] mb-4">
          {saveError
            ? "El guardado en la nube falló la última vez — copia tus datos ahora, por seguridad."
            : lastSaved
            ? `Último guardado en la nube: ${lastSaved.toLocaleTimeString("es-PA", { hour: "2-digit", minute: "2-digit" })}`
            : "Aún no se ha guardado nada."}
        </p>

        <div className="flex gap-2 mb-4">
          <button onClick={() => setMode("export")}
            className={`flex-1 rounded-xl py-2 text-sm font-semibold border ${mode === "export" ? "bg-[#5B2C6F] border-[#5B2C6F] text-white" : "bg-[#FBF6FD] border-[#EFE3F3] text-[#8B7695]"}`}>
            Copiar respaldo
          </button>
          <button onClick={() => setMode("import")}
            className={`flex-1 rounded-xl py-2 text-sm font-semibold border ${mode === "import" ? "bg-[#5B2C6F] border-[#5B2C6F] text-white" : "bg-[#FBF6FD] border-[#EFE3F3] text-[#8B7695]"}`}>
            Restaurar
          </button>
        </div>

        {mode === "export" ? (
          <>
            <p className="text-xs text-[#8B7695] mb-2">Copia este texto y guárdalo por seguridad (WhatsApp a ti mismo, notas, etc.).</p>
            <textarea readOnly value={json} className="w-full h-40 bg-[#FBF6FD] border border-[#EFE3F3] rounded-xl px-3 py-2 text-xs font-mono outline-none" />
            <button onClick={copyToClipboard} className="w-full mt-3 bg-[#5B2C6F] text-white rounded-xl py-3 font-semibold text-sm flex items-center justify-center gap-2 active:scale-95">
              <CopyIcon size={15} /> {copied ? "¡Copiado!" : "Copiar al portapapeles"}
            </button>
          </>
        ) : (
          <>
            <p className="text-xs text-[#8B7695] mb-2">Pega aquí un respaldo que hayas copiado antes. Esto reemplaza los datos actuales.</p>
            <textarea value={importText} onChange={(e) => { setImportText(e.target.value); setImportError(false); }}
              placeholder="Pega aquí el texto del respaldo..."
              className="w-full h-40 bg-[#FBF6FD] border border-[#EFE3F3] rounded-xl px-3 py-2 text-xs font-mono outline-none focus:border-[#5B2C6F]" />
            {importError && <p className="text-xs text-[#E0562F] mt-1.5">Ese texto no tiene el formato correcto.</p>}
            <button onClick={handleImport} disabled={!importText.trim()}
              className="w-full mt-3 bg-[#5B2C6F] disabled:bg-[#D9C7E0] text-white rounded-xl py-3 font-semibold text-sm flex items-center justify-center gap-2 active:scale-95">
              <UploadIcon size={15} /> Restaurar estos datos
            </button>
          </>
        )}
      </div>
    </div>
  );
}

function BinbomApp() {
  const [state, setState] = useState(emptyState());
  const [loaded, setLoaded] = useState(false);
  const [tab, setTab] = useState("inventario");
  const [toast, setToast] = useState("");
  const [saveError, setSaveError] = useState(false);
  const [lastSaved, setLastSaved] = useState(null);
  const [showBackup, setShowBackup] = useState(false);

  // ---------- carga desde Firebase ----------
  useEffect(() => {
    (async () => {
      try {
        const snap = await stateDocRef.get();
        if (snap.exists) {
          const data = snap.data();
          if (data && Array.isArray(data.flavors) && data.flavors.length) {
            setState({
              flavors: data.flavors || [],
              insumos: data.insumos || [],
              producciones: data.producciones || [],
              ventas: data.ventas || [],
            });
          }
        }
      } catch (e) {
        console.error("No se pudo cargar", e);
      } finally {
        setLoaded(true);
      }
    })();
  }, []);

  // ---------- guardado en Firebase ----------
  useEffect(() => {
    if (!loaded) return;
    (async () => {
      try {
        await stateDocRef.set(state);
        setSaveError(false);
        setLastSaved(new Date());
      } catch (e) {
        console.error("No se pudo guardar", e);
        setSaveError(true);
      }
    })();
  }, [state, loaded]);

  const showToast = useCallback((msg) => {
    setToast(msg);
    setTimeout(() => setToast(""), 1800);
  }, []);

  const restoreBackup = (jsonText) => {
    try {
      const parsed = JSON.parse(jsonText);
      if (!parsed || !Array.isArray(parsed.flavors)) throw new Error("formato inválido");
      setState({
        flavors: parsed.flavors || [],
        insumos: parsed.insumos || [],
        producciones: parsed.producciones || [],
        ventas: parsed.ventas || [],
      });
      showToast("Datos restaurados");
      setShowBackup(false);
      return true;
    } catch (e) { return false; }
  };

  // ---------- mutaciones ----------
  const addFlavor = (name) => {
    if (!name.trim()) return;
    setState((s) => ({ ...s, flavors: [...s.flavors, { id: uid(), name: name.trim(), stock: 0 }] }));
    showToast("Sabor agregado");
  };
  const setFlavorStock = (id, stock) => {
    setState((s) => ({ ...s, flavors: s.flavors.map((f) => (f.id === id ? { ...f, stock: Math.max(0, stock) } : f)) }));
  };
  const removeFlavor = (id) => setState((s) => ({ ...s, flavors: s.flavors.filter((f) => f.id !== id) }));
  const setFlavorRecipe = (id, recipe) => {
    setState((s) => ({ ...s, flavors: s.flavors.map((f) => (f.id === id ? { ...f, recipe } : f)) }));
    showToast(recipe ? "Receta guardada" : "Receta eliminada");
  };

  const addInsumo = (name, unit, costPerUnit) => {
    if (!name.trim()) return;
    setState((s) => ({ ...s, insumos: [...s.insumos, { id: uid(), name: name.trim(), unit: unit || "unid", stock: 0, costPerUnit: costPerUnit || 0 }] }));
    showToast("Insumo agregado");
  };
  const setInsumoStock = (id, stock) => {
    setState((s) => ({ ...s, insumos: s.insumos.map((i) => (i.id === id ? { ...i, stock: Math.max(0, stock) } : i)) }));
  };
  const setInsumoCost = (id, costPerUnit) => {
    setState((s) => ({ ...s, insumos: s.insumos.map((i) => (i.id === id ? { ...i, costPerUnit: Math.max(0, costPerUnit) } : i)) }));
  };
  const removeInsumo = (id) => setState((s) => ({ ...s, insumos: s.insumos.filter((i) => i.id !== id) }));

  const registerProduccion = ({ flavorId, cantidad, consumos }) => {
    if (!flavorId || !cantidad) return;
    setState((s) => {
      const flavors = s.flavors.map((f) => (f.id === flavorId ? { ...f, stock: f.stock + cantidad } : f));
      let costoTotal = 0;
      const insumos = s.insumos.map((ins) => {
        const used = consumos.find((c) => c.insumoId === ins.id);
        if (used) costoTotal += used.qty * (ins.costPerUnit || 0);
        return used ? { ...ins, stock: Math.max(0, ins.stock - used.qty) } : ins;
      });
      const producciones = [{ id: uid(), date: todayISO(), flavorId, cantidad, consumos, costo: costoTotal }, ...s.producciones];
      return { ...s, flavors, insumos, producciones };
    });
    showToast("Producción registrada");
  };

  const corregirCantidadProduccion = (produccionId, nuevaCantidad) => {
    setState((s) => {
      const p = s.producciones.find((x) => x.id === produccionId);
      if (!p || nuevaCantidad < 0) return s;
      const diff = nuevaCantidad - p.cantidad;
      const flavors = s.flavors.map((f) => (f.id === p.flavorId ? { ...f, stock: Math.max(0, f.stock + diff) } : f));
      const producciones = s.producciones.map((x) => (x.id === produccionId ? { ...x, cantidad: nuevaCantidad } : x));
      return { ...s, flavors, producciones };
    });
    showToast("Cantidad corregida");
  };

  const registerVenta = ({ flavorId, cantidad, metodo, cliente }) => {
    if (!flavorId || !cantidad) return;
    setState((s) => {
      const flavor = s.flavors.find((f) => f.id === flavorId);
      const cantidadReal = Math.min(cantidad, flavor ? flavor.stock : cantidad);
      const flavors = s.flavors.map((f) => (f.id === flavorId ? { ...f, stock: Math.max(0, f.stock - cantidadReal) } : f));
      const ventas = [{
        id: uid(), date: todayISO(), flavorId, cantidad: cantidadReal, total: cantidadReal * PRICE,
        metodo: metodo || "efectivo", cliente: metodo === "credito" ? (cliente || "").trim() : "",
        pagado: metodo !== "credito",
      }, ...s.ventas];
      return { ...s, flavors, ventas };
    });
    showToast(metodo === "credito" ? "Venta a crédito registrada" : "Venta registrada");
  };

  const marcarPagada = (ventaId) => {
    setState((s) => ({ ...s, ventas: s.ventas.map((v) => (v.id === ventaId ? { ...v, pagado: true } : v)) }));
    showToast("Marcado como pagado");
  };

  const tabs = [
    { id: "inventario", label: "Inventario", icon: PackageIcon },
    { id: "produccion", label: "Producción", icon: SnowflakeIcon },
    { id: "insumos", label: "Insumos", icon: ClipboardListIcon },
    { id: "ventas", label: "Ventas", icon: ShoppingBagIcon },
    { id: "resumen", label: "Resumen", icon: BarChart3Icon },
  ];

  return (
    <div className="min-h-screen bg-[#FFF8F0] text-[#241B2F]">
      <header className="sticky top-0 z-40 bg-gradient-to-r from-[#5B2C6F] to-[#7A3B92] text-white px-5 pt-6 pb-5 shadow-md">
        <div className="flex items-center justify-between gap-2.5">
          <div className="flex items-center gap-2.5">
            <div className="w-9 h-9 rounded-full bg-white/20 flex items-center justify-center">
              <SnowflakeIcon size={18} strokeWidth={2.2} />
            </div>
            <div>
              <h1 className="font-display font-extrabold text-xl leading-none tracking-tight">BINBOM</h1>
              <p className="text-[11px] text-[#EAD9F0] mt-0.5">Cremosidad y sabor en cada mordida</p>
            </div>
          </div>
          <button onClick={() => setShowBackup(true)} className="w-8 h-8 rounded-full bg-white/20 flex items-center justify-center shrink-0" title="Respaldo">
            <SaveIcon size={15} />
          </button>
        </div>
        {saveError && (
          <p className="text-xs text-orange-100 bg-orange-700/40 rounded-lg px-2.5 py-1.5 mt-3 flex items-center gap-1.5">
            <AlertTriangleIcon size={12} /> No se pudo guardar en la nube. Revisa tu conexión a internet.
          </p>
        )}
      </header>

      <main className="px-4 pt-5 pb-28 max-w-md mx-auto">
        {tab === "inventario" && <InventarioTab flavors={state.flavors} insumos={state.insumos} onAdd={addFlavor} onSetStock={setFlavorStock} onSetRecipe={setFlavorRecipe} onRemove={removeFlavor} />}
        {tab === "produccion" && <ProduccionTab flavors={state.flavors} insumos={state.insumos} producciones={state.producciones} onRegister={registerProduccion} onCorregirCantidad={corregirCantidadProduccion} />}
        {tab === "insumos" && <InsumosTab insumos={state.insumos} onAdd={addInsumo} onSetStock={setInsumoStock} onSetCost={setInsumoCost} onRemove={removeInsumo} />}
        {tab === "ventas" && <VentasTab flavors={state.flavors} ventas={state.ventas} onRegister={registerVenta} onMarcarPagada={marcarPagada} />}
        {tab === "resumen" && <ResumenTab state={state} />}
      </main>

      <nav className="fixed bottom-0 left-0 right-0 bg-white border-t border-[#EFE3F3] flex z-40">
        {tabs.map((t) => {
          const IconComp = t.icon;
          const active = tab === t.id;
          return (
            <button key={t.id} onClick={() => setTab(t.id)}
              className={`flex-1 flex flex-col items-center gap-1 py-2.5 text-[10.5px] font-medium transition-colors ${active ? "text-[#5B2C6F]" : "text-[#B7A4C2]"}`}>
              <IconComp size={19} strokeWidth={active ? 2.4 : 2} />
              {t.label}
            </button>
          );
        })}
      </nav>

      {showBackup && (
        <BackupModal state={state} lastSaved={lastSaved} saveError={saveError} onClose={() => setShowBackup(false)} onRestore={restoreBackup} />
      )}

      <Toast message={toast} />
    </div>
  );
}

// ================= INVENTARIO =================
function RecipeModal({ flavor, insumos, onClose, onSave }) {
  const existing = flavor.recipe || { batchSize: "", ingredients: {} };
  const [batchSize, setBatchSize] = useState(existing.batchSize || "");
  const initialQtys = {};
  (existing.ingredients || []).forEach((i) => { initialQtys[i.insumoId] = i.qty; });
  const [qtys, setQtys] = useState(initialQtys);

  const save = () => {
    const bs = parseFloat(batchSize);
    if (!bs || bs <= 0) return;
    const ingredients = Object.entries(qtys).filter(([, v]) => v && parseFloat(v) > 0).map(([insumoId, v]) => ({ insumoId, qty: parseFloat(v) }));
    onSave(flavor.id, { batchSize: bs, ingredients });
    onClose();
  };
  const clear = () => { onSave(flavor.id, null); onClose(); };

  return (
    <div className="fixed inset-0 bg-black/40 z-50 flex items-end justify-center">
      <div className="bg-white w-full max-w-md rounded-t-3xl px-5 pt-5 pb-8 overflow-y-auto" style={{ maxHeight: "85vh" }}>
        <div className="flex items-center justify-between mb-1">
          <h3 className="font-display font-bold text-lg text-[#5B2C6F]">Receta · {flavor.name}</h3>
          <button onClick={onClose} className="w-8 h-8 rounded-full bg-[#F4E9F7] flex items-center justify-center">
            <XIcon size={16} className="text-[#8B7695]" />
          </button>
        </div>
        <p className="text-xs text-[#8B7695] mb-4">Define cuánto rinde esta receta y qué insumos usa. Al producir, la app calculará sola las cantidades.</p>

        <label className="text-xs text-[#8B7695] mb-1 block">Esta receta rinde (cantidad de duros)</label>
        <input type="number" inputMode="numeric" min="1" value={batchSize} onChange={(e) => setBatchSize(e.target.value)}
          placeholder="Ej. 30" className="w-full bg-[#FBF6FD] border border-[#EFE3F3] rounded-xl px-3 py-2.5 text-sm outline-none mb-4 focus:border-[#5B2C6F]" />

        {insumos.length === 0 ? (
          <p className="text-sm text-[#B7A4C2] py-4 text-center">Primero agrega insumos en la pestaña Insumos.</p>
        ) : (
          <>
            <label className="text-xs text-[#8B7695] mb-1.5 block">Insumos que usa esta tanda completa</label>
            <div className="space-y-2 mb-2">
              {insumos.map((ins) => (
                <div key={ins.id} className="flex items-center gap-2">
                  <span className="text-sm flex-1 min-w-0 truncate">{ins.name}</span>
                  <input type="number" inputMode="decimal" min="0" placeholder="0" value={qtys[ins.id] || ""}
                    onChange={(e) => setQtys((q) => ({ ...q, [ins.id]: e.target.value }))}
                    className="w-20 bg-[#FBF6FD] border border-[#EFE3F3] rounded-lg px-2 py-1.5 text-sm text-right outline-none focus:border-[#5B2C6F]" />
                  <span className="text-xs text-[#B7A4C2] w-9">{ins.unit}</span>
                </div>
              ))}
            </div>
          </>
        )}

        <button onClick={save} disabled={!batchSize}
          className="w-full mt-3 bg-[#5B2C6F] disabled:bg-[#D9C7E0] text-white rounded-xl py-3 font-semibold text-sm active:scale-95">
          Guardar receta
        </button>
        {flavor.recipe && (
          <button onClick={clear} className="w-full mt-2 text-[#E0562F] text-sm font-medium py-2">
            Quitar receta de este sabor
          </button>
        )}
      </div>
    </div>
  );
}

function ProduccionTab({ flavors, insumos, producciones, onRegister, onCorregirCantidad }) {
  const [flavorId, setFlavorId] = useState("");
  const [cantidad, setCantidad] = useState("");
  const [consumos, setConsumos] = useState({});
  const [editingId, setEditingId] = useState(null);
  const [editValue, setEditValue] = useState("");

  const selectedFlavor = flavors.find((f) => f.id === flavorId);
  const recipe = selectedFlavor?.recipe;
  const cant = parseInt(cantidad, 10) || 0;

  const insumoName = (id) => insumos.find((i) => i.id === id)?.name || "—";
  const insumoUnit = (id) => insumos.find((i) => i.id === id)?.unit || "";

  const recipePreview = recipe && cant > 0
    ? recipe.ingredients.map((ing) => ({ ...ing, scaled: (ing.qty / recipe.batchSize) * cant }))
    : [];

  const submit = () => {
    if (!flavorId || !cant || cant <= 0) return;
    let consumosArr;
    if (recipe) {
      consumosArr = recipePreview.map((ing) => ({ insumoId: ing.insumoId, qty: ing.scaled }));
    } else {
      consumosArr = Object.entries(consumos).filter(([, v]) => v && parseFloat(v) > 0).map(([insumoId, v]) => ({ insumoId, qty: parseFloat(v) }));
    }
    onRegister({ flavorId, cantidad: cant, consumos: consumosArr });
    setFlavorId(""); setCantidad(""); setConsumos({});
  };

  const flavorName = (id) => flavors.find((f) => f.id === id)?.name || "—";

  return (
    <div className="space-y-4">
      <h2 className="font-display font-bold text-lg text-[#5B2C6F]">Registrar producción</h2>
      <Card>
        <p className="text-xs font-semibold text-[#8B7695] mb-2 uppercase tracking-wide">Nueva tanda</p>
        <label className="text-xs text-[#8B7695] mb-1 block">Sabor</label>
        <select value={flavorId} onChange={(e) => setFlavorId(e.target.value)}
          className="w-full bg-[#FBF6FD] border border-[#EFE3F3] rounded-xl px-3 py-2.5 text-sm outline-none mb-3 focus:border-[#5B2C6F]">
          <option value="">Selecciona un sabor</option>
          {flavors.map((f) => <option key={f.id} value={f.id}>{f.name}{f.recipe ? " (con receta)" : ""}</option>)}
        </select>
        <label className="text-xs text-[#8B7695] mb-1 block">Cantidad producida</label>
        <input type="number" inputMode="numeric" min="1" value={cantidad} onChange={(e) => setCantidad(e.target.value)}
          placeholder="Ej. 20" className="w-full bg-[#FBF6FD] border border-[#EFE3F3] rounded-xl px-3 py-2.5 text-sm outline-none mb-3 focus:border-[#5B2C6F]" />

        {recipe ? (
          <div className="mb-1">
            <label className="text-xs text-[#8B7695] mb-1.5 block">Se descontará automáticamente (según receta)</label>
            {recipePreview.length === 0 ? (
              <p className="text-xs text-[#B7A4C2]">Ingresa la cantidad para ver el cálculo.</p>
            ) : (
              <div className="space-y-1.5">
                {recipePreview.map((ing) => (
                  <div key={ing.insumoId} className="flex items-center justify-between text-sm bg-[#FBF6FD] rounded-lg px-3 py-2">
                    <span>{insumoName(ing.insumoId)}</span>
                    <span className="font-semibold">{ing.scaled.toFixed(2)} {insumoUnit(ing.insumoId)}</span>
                  </div>
                ))}
              </div>
            )}
          </div>
        ) : insumos.length > 0 && (
          <>
            <label className="text-xs text-[#8B7695] mb-1.5 block">Insumos que se usaron (opcional — este sabor no tiene receta)</label>
            <div className="space-y-2 mb-1">
              {insumos.map((ins) => (
                <div key={ins.id} className="flex items-center gap-2">
                  <span className="text-sm flex-1 min-w-0 truncate">{ins.name}</span>
                  <input type="number" inputMode="decimal" min="0" placeholder="0" value={consumos[ins.id] || ""}
                    onChange={(e) => setConsumos((c) => ({ ...c, [ins.id]: e.target.value }))}
                    className="w-20 bg-[#FBF6FD] border border-[#EFE3F3] rounded-lg px-2 py-1.5 text-sm text-right outline-none focus:border-[#5B2C6F]" />
                  <span className="text-xs text-[#B7A4C2] w-9">{ins.unit}</span>
                </div>
              ))}
            </div>
          </>
        )}
        <button onClick={submit} disabled={!flavorId || !cantidad}
          className="w-full mt-2 bg-[#5B2C6F] disabled:bg-[#D9C7E0] text-white rounded-xl py-3 font-semibold text-sm active:scale-95">
          Registrar producción
        </button>
      </Card>

      <p className="text-xs font-semibold text-[#8B7695] uppercase tracking-wide px-1">Historial</p>
      {producciones.length === 0 ? (
        <EmptyState icon={SnowflakeIcon} title="Sin producción registrada" sub="Cada tanda que hagas aparecerá aquí y sumará al inventario." />
      ) : (
        <div className="space-y-2">
          {producciones.slice(0, 25).map((p) => (
            <div key={p.id} className="bg-white rounded-xl px-4 py-3 border border-[#EFE3F3]">
              <div className="flex items-center justify-between">
                <div>
                  <p className="text-sm font-medium">{flavorName(p.flavorId)}</p>
                  {p.consumos?.length > 0 && (
                    <p className="text-[11px] text-[#8B7695] mt-0.5">{p.consumos.map((c) => `${insumoName(c.insumoId)} ${c.qty.toFixed(1)}`).join(" · ")}</p>
                  )}
                </div>
                <div className="flex items-center gap-2">
                  <div className="text-right">
                    <p className="text-sm font-bold text-[#2EC4B6]">+{p.cantidad}</p>
                    {p.costo > 0 && (
                      <p className="text-[10.5px] text-[#B3501C] font-medium">{fmtMoney(p.costo)} · {fmtMoney(p.costo / p.cantidad)}/duro</p>
                    )}
                    <p className="text-[10.5px] text-[#B7A4C2]">{fmtDate(p.date)}</p>
                  </div>
                  <button onClick={() => { setEditingId(p.id); setEditValue(String(p.cantidad)); }}
                    className="w-7 h-7 rounded-full bg-[#F4E9F7] text-[#5B2C6F] flex items-center justify-center shrink-0">
                    <PencilIcon size={12} />
                  </button>
                </div>
              </div>
              {editingId === p.id && (
                <div className="mt-2.5 pt-2.5 border-t border-[#EFE3F3] flex items-center gap-2">
                  <label className="text-xs text-[#8B7695] shrink-0">Cantidad real que salió:</label>
                  <input type="number" inputMode="numeric" min="0" value={editValue} onChange={(e) => setEditValue(e.target.value)}
                    className="w-16 bg-[#FBF6FD] border border-[#EFE3F3] rounded-lg px-2 py-1 text-sm text-right outline-none focus:border-[#5B2C6F]" />
                  <button onClick={() => { onCorregirCantidad(p.id, parseInt(editValue, 10) || 0); setEditingId(null); }}
                    className="bg-[#5B2C6F] text-white text-xs font-semibold rounded-lg px-3 py-1.5">
                    Guardar
                  </button>
                  <button onClick={() => setEditingId(null)} className="text-xs text-[#B7A4C2] font-medium px-2">Cancelar</button>
                </div>
              )}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

const METODOS = [
  { id: "efectivo", label: "Efectivo" },
  { id: "yappy", label: "Yappy" },
  { id: "credito", label: "Crédito" },
];

function VentasTab({ flavors, ventas, onRegister, onMarcarPagada }) {
  const [flavorId, setFlavorId] = useState("");
  const [cantidad, setCantidad] = useState("");
  const [metodo, setMetodo] = useState("efectivo");
  const [cliente, setCliente] = useState("");

  const flavorName = (id) => flavors.find((f) => f.id === id)?.name || "—";
  const selected = flavors.find((f) => f.id === flavorId);

  const submit = () => {
    const cant = parseInt(cantidad, 10);
    if (!flavorId || !cant || cant <= 0) return;
    if (metodo === "credito" && !cliente.trim()) return;
    onRegister({ flavorId, cantidad: cant, metodo, cliente });
    setFlavorId(""); setCantidad(""); setCliente(""); setMetodo("efectivo");
  };

  const hoy = todayISO();
  const ventasHoy = ventas.filter((v) => v.date === hoy);
  const totalHoy = ventasHoy.reduce((a, v) => a + v.total, 0);
  const cantHoy = ventasHoy.reduce((a, v) => a + v.cantidad, 0);
  const pendientes = ventas.filter((v) => v.metodo === "credito" && !v.pagado);
  const totalPendiente = pendientes.reduce((a, v) => a + v.total, 0);

  const metodoBadge = (v) => {
    if (v.metodo === "credito") return v.pagado ? "bg-[#F4E9F7] text-[#8B7695]" : "bg-[#FF8552]/15 text-[#B3501C]";
    if (v.metodo === "yappy") return "bg-[#2EC4B6]/15 text-[#1B8377]";
    return "bg-[#F4E9F7] text-[#5B2C6F]";
  };
  const metodoLabel = (v) => {
    if (v.metodo === "credito") return v.pagado ? "Crédito · pagado" : "Crédito · pendiente";
    return METODOS.find((m) => m.id === v.metodo)?.label || "Efectivo";
  };

  return (
    <div className="space-y-4">
      <div className="flex items-center justify-between">
        <h2 className="font-display font-bold text-lg text-[#5B2C6F]">Ventas</h2>
        <span className="text-xs bg-[#FF8552]/15 text-[#B3501C] font-semibold px-2.5 py-1 rounded-full">Hoy: {cantHoy} · {fmtMoney(totalHoy)}</span>
      </div>

      <Card>
        <p className="text-xs font-semibold text-[#8B7695] mb-2 uppercase tracking-wide">Nueva venta · $1 c/u</p>
        <label className="text-xs text-[#8B7695] mb-1 block">Sabor</label>
        <select value={flavorId} onChange={(e) => setFlavorId(e.target.value)}
          className="w-full bg-[#FBF6FD] border border-[#EFE3F3] rounded-xl px-3 py-2.5 text-sm outline-none mb-3 focus:border-[#5B2C6F]">
          <option value="">Selecciona un sabor</option>
          {flavors.map((f) => <option key={f.id} value={f.id} disabled={f.stock === 0}>{f.name} ({f.stock} disp.)</option>)}
        </select>
        <label className="text-xs text-[#8B7695] mb-1 block">Cantidad vendida</label>
        <input type="number" inputMode="numeric" min="1" max={selected?.stock || undefined} value={cantidad}
          onChange={(e) => setCantidad(e.target.value)} placeholder="Ej. 5"
          className="w-full bg-[#FBF6FD] border border-[#EFE3F3] rounded-xl px-3 py-2.5 text-sm outline-none mb-3 focus:border-[#5B2C6F]" />
        <label className="text-xs text-[#8B7695] mb-1.5 block">Forma de pago</label>
        <div className="grid grid-cols-3 gap-2 mb-3">
          {METODOS.map((m) => (
            <button key={m.id} type="button" onClick={() => setMetodo(m.id)}
              className={`rounded-xl py-2 text-xs font-semibold border ${metodo === m.id ? "bg-[#5B2C6F] border-[#5B2C6F] text-white" : "bg-[#FBF6FD] border-[#EFE3F3] text-[#8B7695]"}`}>
              {m.label}
            </button>
          ))}
        </div>
        {metodo === "credito" && (
          <div className="mb-3">
            <label className="text-xs text-[#8B7695] mb-1 block">Nombre del cliente</label>
            <input value={cliente} onChange={(e) => setCliente(e.target.value)} placeholder="¿Quién se lleva fiado?"
              className="w-full bg-[#FBF6FD] border border-[#EFE3F3] rounded-xl px-3 py-2.5 text-sm outline-none focus:border-[#5B2C6F]" />
            <p className="text-xs text-[#B3501C] mt-1.5">Queda pendiente hasta que lo marques como pagado en quincena.</p>
          </div>
        )}
        {cantidad && <p className="text-xs text-[#2EC4B6] font-medium mb-3">Total: {fmtMoney(parseInt(cantidad, 10) * PRICE || 0)}</p>}
        <button onClick={submit} disabled={!flavorId || !cantidad || (selected && selected.stock === 0) || (metodo === "credito" && !cliente.trim())}
          className="w-full mt-1 bg-[#5B2C6F] disabled:bg-[#D9C7E0] text-white rounded-xl py-3 font-semibold text-sm active:scale-95">
          Registrar venta
        </button>
      </Card>

      {pendientes.length > 0 && (
        <Card>
          <div className="flex items-center justify-between mb-3">
            <p className="text-xs font-semibold text-[#B3501C] uppercase tracking-wide">Por cobrar (crédito)</p>
            <span className="text-xs font-bold text-[#B3501C]">{fmtMoney(totalPendiente)}</span>
          </div>
          <div className="space-y-2">
            {pendientes.map((v) => (
              <div key={v.id} className="flex items-center justify-between gap-2 bg-[#FFF8F0] rounded-xl px-3 py-2.5">
                <div className="min-w-0">
                  <p className="text-sm font-semibold truncate">{v.cliente || "Sin nombre"}</p>
                  <p className="text-xs text-[#8B7695]">{flavorName(v.flavorId)} · {v.cantidad} · {fmtDate(v.date)}</p>
                </div>
                <button onClick={() => onMarcarPagada(v.id)} className="shrink-0 bg-[#2EC4B6] text-white text-xs font-semibold rounded-lg px-3 py-2 active:scale-95">
                  {fmtMoney(v.total)} · Pagar
                </button>
              </div>
            ))}
          </div>
        </Card>
      )}

      <p className="text-xs font-semibold text-[#8B7695] uppercase tracking-wide px-1">Historial</p>
      {ventas.length === 0 ? (
        <EmptyState icon={ShoppingBagIcon} title="Sin ventas todavía" sub="Cada venta que registres aparecerá aquí y se restará del inventario." />
      ) : (
        <div className="space-y-2">
          {ventas.slice(0, 25).map((v) => (
            <div key={v.id} className="bg-white rounded-xl px-4 py-3 border border-[#EFE3F3] flex items-center justify-between gap-2">
              <div className="min-w-0">
                <p className="text-sm font-medium truncate">{flavorName(v.flavorId)}{v.cliente ? ` · ${v.cliente}` : ""}</p>
                <div className="flex items-center gap-1.5 mt-1">
                  <span className={`text-[10px] font-semibold px-1.5 py-0.5 rounded ${metodoBadge(v)}`}>{metodoLabel(v)}</span>
                  <span className="text-xs text-[#B7A4C2]">{fmtDate(v.date)}</span>
                </div>
              </div>
              <p className="text-sm font-bold text-[#FF8552] shrink-0">{v.cantidad} · {fmtMoney(v.total)}</p>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ================= RESUMEN =================
function ResumenTab({ state }) {
  const { ventas, producciones, flavors } = state;
  const hoy = todayISO();
  const inicioMes = hoy.slice(0, 7);

  const ventasMes = ventas.filter((v) => v.date.startsWith(inicioMes));
  const totalVentasMes = ventasMes.reduce((a, v) => a + v.total, 0);
  const unidadesVendidasMes = ventasMes.reduce((a, v) => a + v.cantidad, 0);
  const ventasHoy = ventas.filter((v) => v.date === hoy);
  const totalHoy = ventasHoy.reduce((a, v) => a + v.total, 0);
  const producidasMes = producciones.filter((p) => p.date.startsWith(inicioMes)).reduce((a, p) => a + p.cantidad, 0);
  const gastoInsumosMes = producciones.filter((p) => p.date.startsWith(inicioMes)).reduce((a, p) => a + (p.costo || 0), 0);
  const gananciaMes = totalVentasMes - gastoInsumosMes;
  const costoPromedioPorDuro = producidasMes > 0 ? gastoInsumosMes / producidasMes : 0;
  const margenPorDuro = PRICE - costoPromedioPorDuro;
  const stockTotal = flavors.reduce((a, f) => a + f.stock, 0);
  const pendientesCredito = ventas.filter((v) => v.metodo === "credito" && !v.pagado);
  const totalPorCobrar = pendientesCredito.reduce((a, v) => a + v.total, 0);

  const ranking = {};
  ventas.forEach((v) => { ranking[v.flavorId] = (ranking[v.flavorId] || 0) + v.cantidad; });
  const top = Object.entries(ranking).sort((a, b) => b[1] - a[1]).slice(0, 5)
    .map(([id, qty]) => ({ name: flavors.find((f) => f.id === id)?.name || "—", qty }));
  const maxQty = top[0]?.qty || 1;

  return (
    <div className="space-y-4">
      <h2 className="font-display font-bold text-lg text-[#5B2C6F]">Resumen</h2>
      <div className="grid grid-cols-2 gap-3">
        <Card>
          <p className="text-[11px] text-[#8B7695] font-medium">Ventas de hoy</p>
          <p className="font-display font-extrabold text-2xl text-[#5B2C6F] mt-1">{fmtMoney(totalHoy)}</p>
          <p className="text-[11px] text-[#B7A4C2] mt-0.5">{ventasHoy.reduce((a, v) => a + v.cantidad, 0)} duros</p>
        </Card>
        <Card>
          <p className="text-[11px] text-[#8B7695] font-medium">Inventario actual</p>
          <p className="font-display font-extrabold text-2xl text-[#2EC4B6] mt-1">{stockTotal}</p>
          <p className="text-[11px] text-[#B7A4C2] mt-0.5">duros disponibles</p>
        </Card>
        <Card>
          <p className="text-[11px] text-[#8B7695] font-medium flex items-center gap-1"><TrendingUpIcon size={12} /> Ventas del mes</p>
          <p className="font-display font-extrabold text-2xl text-[#FF8552] mt-1">{fmtMoney(totalVentasMes)}</p>
          <p className="text-[11px] text-[#B7A4C2] mt-0.5">{unidadesVendidasMes} duros vendidos</p>
        </Card>
        <Card>
          <p className="text-[11px] text-[#8B7695] font-medium flex items-center gap-1"><TrendingDownIcon size={12} /> Producción del mes</p>
          <p className="font-display font-extrabold text-2xl text-[#241B2F] mt-1">{producidasMes}</p>
          <p className="text-[11px] text-[#B7A4C2] mt-0.5">duros producidos</p>
        </Card>
      </div>

      {gastoInsumosMes > 0 && (
        <div className="bg-[#5B2C6F]/5 border border-[#5B2C6F]/20 rounded-2xl px-5 py-4">
          <p className="text-xs text-[#5B2C6F] font-semibold uppercase tracking-wide mb-2">Ganancia del mes (ventas − insumos)</p>
          <div className="flex items-end justify-between mb-3">
            <div>
              <p className="text-[11px] text-[#8B7695]">Gastado en insumos</p>
              <p className="font-display font-bold text-lg text-[#B3501C]">−{fmtMoney(gastoInsumosMes)}</p>
            </div>
            <div className="text-right">
              <p className="text-[11px] text-[#8B7695]">Ganancia real</p>
              <p className={`font-display font-extrabold text-2xl ${gananciaMes >= 0 ? "text-[#2EC4B6]" : "text-[#E0562F]"}`}>{fmtMoney(gananciaMes)}</p>
            </div>
          </div>
          <div className="flex items-center justify-between border-t border-[#5B2C6F]/10 pt-2.5">
            <span className="text-xs text-[#8B7695]">Costo por duro (promedio)</span>
            <span className="text-sm font-semibold text-[#B3501C]">{fmtMoney(costoPromedioPorDuro)}</span>
          </div>
          <div className="flex items-center justify-between mt-1">
            <span className="text-xs text-[#8B7695]">Ganas por duro vendido a $1</span>
            <span className={`text-sm font-semibold ${margenPorDuro >= 0 ? "text-[#1B8377]" : "text-[#E0562F]"}`}>{fmtMoney(margenPorDuro)}</span>
          </div>
        </div>
      )}

      {totalPorCobrar > 0 && (
        <div className="bg-[#FFF8F0] border border-[#FFD9B3] rounded-2xl px-5 py-4 flex items-center justify-between">
          <div>
            <p className="text-xs text-[#B3501C] font-medium flex items-center gap-1"><AlertTriangleIcon size={12} /> Pendiente por cobrar (crédito)</p>
            <p className="font-display font-extrabold text-xl text-[#B3501C] mt-0.5">{fmtMoney(totalPorCobrar)}</p>
            <p className="text-xs text-[#B3501C]/70 mt-0.5">{pendientesCredito.length} venta{pendientesCredito.length === 1 ? "" : "s"} sin cobrar</p>
          </div>
        </div>
      )}

      <Card>
        <p className="text-xs font-semibold text-[#8B7695] mb-3 uppercase tracking-wide">Sabores más vendidos</p>
        {top.length === 0 ? (
          <p className="text-sm text-[#B7A4C2] py-4 text-center">Aún no hay ventas registradas.</p>
        ) : (
          <div className="space-y-2.5">
            {top.map((t) => (
              <div key={t.name}>
                <div className="flex justify-between text-xs mb-1">
                  <span className="font-medium">{t.name}</span>
                  <span className="text-[#8B7695]">{t.qty}</span>
                </div>
                <div className="h-2 bg-[#F4E9F7] rounded-full overflow-hidden">
                  <div className="h-full bg-gradient-to-r from-[#5B2C6F] to-[#FF8552] rounded-full" style={{ width: `${(t.qty / maxQty) * 100}%` }} />
                </div>
              </div>
            ))}
          </div>
        )}
      </Card>

      <div className="bg-[#5B2C6F] rounded-2xl px-5 py-4 flex items-center justify-between text-white">
        <div>
          <p className="text-[11px] text-[#EAD9F0]">Total histórico vendido</p>
          <p className="font-display font-extrabold text-xl">{fmtMoney(ventas.reduce((a, v) => a + v.total, 0))}</p>
        </div>
        <ChevronRightIcon size={20} className="opacity-60" />
      </div>
    </div>
  );
}

try {
  ReactDOM.createRoot(document.getElementById("root")).render(<BinbomApp />);
} catch (err) {
  showFallbackError(err && err.message ? err.message : String(err));
}
</script>
</body>
</html>
